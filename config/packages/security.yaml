security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_ADMIN: ROLE_VIEWER

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # OAuth discovery, registration and token endpoints: public, no session
        oauth:
            pattern: ^/(\.well-known/oauth-|oauth/(token|register|revoke)$)
            security: false
        mcp:
            pattern: ^/mcp
            stateless: true
            provider: app_users
            access_token:
                token_handler: App\OAuth\McpTokenHandler
                failure_handler: App\OAuth\BearerChallenge
            entry_point: App\OAuth\BearerChallenge
        main:
            lazy: true
            provider: app_users
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home
            login_throttling:
                max_attempts: 5
            logout:
                path: /logout
                enable_csrf: true
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 1209600

    access_control:
        - { path: ^/(login|health|webhook/), roles: PUBLIC_ACCESS }
        - { path: ^/mcp, roles: IS_AUTHENTICATED }
        - { path: ^/, roles: ROLE_VIEWER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
