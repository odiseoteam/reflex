# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    http_client:
        scoped_clients:
            # a slow embeddings server must not hold a decision or a run
            embeddings.client:
                base_uri: '%env(EMBEDDINGS_URL)%'
                timeout: 5
                max_duration: 10

    rate_limiter:
        oauth_register:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        oauth_token:
            policy: sliding_window
            limit: 60
            interval: '1 minute'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
