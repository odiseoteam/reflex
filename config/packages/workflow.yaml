framework:
    workflows:
        decision:
            type: state_machine
            audit_trail:
                enabled: true
            marking_store:
                type: method
                property: status
            supports:
                - App\Entity\Decision
            initial_marking: proposed
            places: [proposed, asked, approved, rejected, executed, failed]
            transitions:
                approve:
                    from: proposed
                    to: approved
                reject:
                    from: [proposed, asked]
                    to: rejected
                # The server paused the call to ask something.
                ask:
                    from: approved
                    to: asked
                answer:
                    from: asked
                    to: approved
                execute:
                    from: approved
                    to: executed
                fail:
                    from: approved
                    to: failed
