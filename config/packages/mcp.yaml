mcp:
    servers:
        reflex:
            name: Reflex
            description: The decision inbox, reflexes and runs of this Reflex instance.
            instructions: |
                Reflex runs agents ("reflexes") that react to events and propose actions people approve.
                Use list_decisions to see what waits for a person, get_decision before deciding,
                and approve or reject only what the user explicitly asked you to.
                Approving runs the exact tool call shown; it acts as the signed-in person.
            http:
                path: /mcp
                # Hosts the endpoint answers on, besides localhost; set it when exposing Reflex publicly.
                allowed_hosts: '%env(csv:MCP_ALLOWED_HOSTS)%'
            session:
                store: none
            registry:
                tools: ['App\Mcp\Server\']
