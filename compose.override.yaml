# Development setup, merged automatically by `docker compose up`
services:
  php:
    build:
      context: .
      target: frankenphp_dev
    user: '${UID:-1000}:${GID:-1000}'
    volumes:
      - ./:/app
      - ./docker/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./docker/frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
    environment:
      FRANKENPHP_WORKER_CONFIG: watch

  worker:
    build:
      context: .
      target: frankenphp_dev
    user: '${UID:-1000}:${GID:-1000}'
    volumes:
      - ./:/app
      - ./docker/frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro

  listener:
    build:
      context: .
      target: frankenphp_dev
    user: '${UID:-1000}:${GID:-1000}'
    volumes:
      - ./:/app
      - ./docker/frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro

  demo:
    build:
      context: .
      target: frankenphp_dev
    user: '${UID:-1000}:${GID:-1000}'
    volumes:
      - ./:/app

  tailwind:
    build:
      context: .
      target: frankenphp_dev
    user: '${UID:-1000}:${GID:-1000}'
    command: ['php', 'bin/console', 'tailwind:build', '--watch']
    # Tailwind's watcher exits when stdin closes
    tty: true
    volumes:
      - ./:/app
    healthcheck:
      disable: true
    depends_on:
      php:
        condition: service_healthy

  database:
    # Random host port to avoid clashing with a local Postgres
    ports:
      - target: 5432
        protocol: tcp
